<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Google Maps | Aditya Transport</title>
<style>
:root{--bg:#f3f6fb;--ink:#14213d;--muted:#5a6b85;--accent:#12357a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1626;--ink:#e8edf6;--muted:#9fb0c9;--accent:#7fa6ff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Devanagari",sans-serif;padding:16px;text-align:center}
a.btn{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}
p{color:var(--muted);margin:6px 0}
</style>
</head>
<body>
<main>
  <h1 style="font-size:20px;margin:0">Google Maps उघडत आहे…</h1>
  <p>Opening Google Maps…</p>
  <a class="btn" id="go" href="https://www.google.com/maps">Google Maps उघडा</a>
</main>
<script>
(function(){
  var sp=new URLSearchParams(location.search),u=sp.get("u")||"",q=sp.get("q")||"",dest="https://www.google.com/maps";
  // Only ever forwards to Google Maps
  var ok=/^https:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|(www\.)?google\.[a-z.]+\/maps|maps\.google\.[a-z.]+)(\/|\?|$)/i;
  if(u&&ok.test(u))dest=u;
  else if(q)dest="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
  document.getElementById("go").href=dest;
  location.replace(dest);
})();
</script>
</body>
</html>
