<script src="config.js"></script>
<style>
:root{--bg:#EEF2F8;--panel:#fff;--ink:#14213D;--muted:#5B6B84;--line:#D3DCE8;--accent:#12357A;--sky:#3FA0DD;--ok:#15803D;--okbg:#E8F6EE;--warn:#B45309;--warnbg:#FDF3E3;--bad:#B42318;--badbg:#FCEBEA;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;--body:"IBM Plex Sans","Segoe UI",Arial,sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0B1322;--panel:#121C30;--ink:#E5EBF5;--muted:#94A4BD;--line:#26354F;--accent:#8DBEF3;--ok:#4ADE80;--okbg:#10291C;--warn:#F5A524;--warnbg:#2E2210;--bad:#F87171;--badbg:#2E1416;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(440px,100%);overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:3px solid var(--sky)}
.top img{width:64px;height:auto}
.top b{font-family:var(--display);font-size:20px;font-weight:800;color:var(--accent);display:block;letter-spacing:.01em}
.top span{font-size:12px;color:var(--muted)}
.res{padding:20px}
.badge{display:flex;gap:12px;align-items:flex-start;border-radius:12px;padding:14px 16px;font-weight:600;line-height:1.4}
.badge .ic{font-size:26px;line-height:1;flex:none}
.badge small{display:block;font-weight:400;color:var(--ink);opacity:.85;margin-top:2px}
.ok{background:var(--okbg);color:var(--ok)}.warn{background:var(--warnbg);color:var(--warn)}.bad{background:var(--badbg);color:var(--bad)}.wait{background:var(--bg);color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;margin:18px 2px 4px}
dt{color:var(--muted);font-size:13px}
dd{margin:0;font-weight:600;overflow-wrap:anywhere}
dd.mono{font-family:var(--mono)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700}
.pill.d{background:var(--okbg);color:var(--ok)}.pill.t{background:var(--warnbg);color:var(--warn)}
.foot{padding:14px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);line-height:1.5}
.spin{width:22px;height:22px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;flex:none}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=new URLSearchParams(location.search),lr=(P.get("lr")||"").trim(),k=(P.get("k")||"").trim();
const API=(window.LR_CONFIG&&window.LR_CONFIG.scriptUrl)||"";
function show(cls,icon,title,sub,rows){
  $("res").innerHTML=`<div class="badge ${cls}" role="status"><div class="ic" aria-hidden="true">${icon}</div><div>${title}${sub?`<small>${sub}</small>`:""}</div></div>`+
    (rows?`<dl>${rows.filter(r=>r[1]).map(r=>`<dt>${r[0]}</dt><dd${r[2]?` class="${r[2]}"`:""}>${r[1]}</dd>`).join("")}</dl>`:"");
}
async function run(){
  if(!lr||!k){show("bad","✕","No LR details in this link","Scan the QR code printed on the LR again.");return}
  try{
    const ctl=new AbortController();setTimeout(()=>ctl.abort(),30000);
    const r=await fetch(API,{method:"POST",body:JSON.stringify({action:"verify",lr,k}),signal:ctl.signal});
    const j=await r.json();
    if(!j.ok){show("warn","!","Could not check right now",esc(j.error||"Please try again."));return}
    if(j.status==="genuine"){
      show("ok","✓","Genuine LR issued by Aditya Transport","The details below match our records. Compare them with the printed LR.",[
        ["LR No.",esc(j.lrNo),"mono"],["LR Date",esc(j.date)],["Vehicle No.",esc(j.veh),"mono"],["From",esc(j.from)],["To",esc(j.to)],
        ["Status",j.delivered?`<span class="pill d">Delivered${j.deliveredOn?" "+esc(j.deliveredOn):""}</span>`:`<span class="pill t">In Transit</span>`]]);
      document.title="Genuine LR "+j.lrNo+" · Aditya Transport";
    }else if(j.status==="cancelled"){
      show("warn","!","This LR has been cancelled","LR "+esc(j.lrNo)+" was issued by Aditya Transport but is no longer valid. Contact us before accepting it.");
    }else{
      show("bad","✕","Not a valid Aditya Transport LR","We have no record matching this code. The LR may be altered or fake. Please contact us on 8007500060.");
    }
  }catch(e){show("warn","!","Could not check right now","Check your internet connection and scan again.")}
}
