<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: sticky toolbar, form on the left, live A4 preview on the right; one column with Form/Preview tabs on phones */
:root{
  --bg:#EEF2F8; --panel:#FFFFFF; --ink:#14213D; --muted:#5B6B84; --line:#D3DCE8; --field:#F8FAFD;
  --accent:#12357A; --on-accent:#FFFFFF; --sky:#3FA0DD; --ok:#15803D; --warn:#B45309; --danger:#B42318; --chip:#E3ECF8;
  --display:"Archivo","Arial Narrow",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1322; --panel:#121C30; --ink:#E5EBF5; --muted:#94A4BD; --line:#26354F; --field:#0E1829;
  --accent:#8DBEF3; --on-accent:#0B1322; --sky:#4FB0EA; --ok:#4ADE80; --warn:#F5A524; --danger:#F87171; --chip:#1B2A44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1322; --panel:#121C30; --ink:#E5EBF5; --muted:#94A4BD; --line:#26354F; --field:#0E1829;
  --accent:#8DBEF3; --on-accent:#0B1322; --sky:#4FB0EA; --ok:#4ADE80; --warn:#F5A524; --danger:#F87171; --chip:#1B2A44; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand img{width:34px;height:34px;object-fit:contain}
.brand b{font-family:var(--display);font-weight:800;letter-spacing:.02em;font-size:17px;white-space:nowrap}
.brand span{color:var(--muted);font-size:12px;display:block}
.lrchip{font-family:var(--mono);font-weight:600;background:var(--chip);border-radius:6px;padding:5px 10px;font-size:13px;white-space:nowrap}
.lrchip small{font-family:var(--body);color:var(--muted);font-weight:500;margin-right:6px}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.dirty{color:var(--warn)} .status.ok{color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.tabs{display:none;gap:6px;padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs button{flex:1;border:1px solid var(--line);background:var(--field);padding:7px;border-radius:8px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:18px;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.form{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px}
.card h2{font-family:var(--display);font-size:13px;letter-spacing:.09em;text-transform:uppercase;margin:0 0 12px;color:var(--accent);display:flex;align-items:center;gap:8px;text-wrap:balance}
.card h2 .hint{font-family:var(--body);text-transform:none;letter-spacing:0;color:var(--muted);font-weight:500;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.w2{grid-column:span 2} .f.w4{grid-column:1/-1}
.f label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.03em}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);background:var(--field);border-radius:7px;padding:7px 9px;min-width:0}
.f textarea{resize:vertical;min-height:54px}
.f input:disabled,.f textarea:disabled{opacity:.75;background:var(--chip)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.items{overflow-x:auto}
.items table{border-collapse:collapse;width:100%;min-width:720px}
.items th{font-size:11px;color:var(--muted);text-align:left;font-weight:600;padding:0 4px 6px}
.items td{padding:3px}
.items input{width:100%;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:6px 7px;min-width:0}
.items input.num{text-align:right;font-variant-numeric:tabular-nums}
.items .x{border:none;background:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px 6px}
.totals{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:13px;color:var(--muted)}
.totals b{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.conds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px}
.cond{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:5px 6px 5px 10px;font-size:13px}
.cond button{width:34px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
.cond button.yes{color:var(--ok);border-color:var(--ok)} .cond button.no{color:var(--danger);border-color:var(--danger)}

 .stat-row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px}
.stat-row .f{min-width:150px}
.stat-row .status{flex:1 1 220px;align-self:center}
.chip{display:inline-block;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;white-space:nowrap;align-self:center}
.chip.sm{padding:2px 8px;font-size:11px;font-family:var(--body);vertical-align:middle;margin-left:4px}
.chip.transit{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.done{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.chip.draft{background:var(--chip);color:var(--muted)}
.preview{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start;min-width:0}
.pv-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;color:var(--muted)}
.pv-wrap{width:100%;overflow:hidden;border-radius:6px;box-shadow:0 1px 2px rgba(15,30,60,.12),0 8px 28px rgba(15,30,60,.14)}
.pv-wrap{background:transparent}
#pv .sheet+.sheet{margin-top:18px}
.sheet>*{flex-shrink:0}
.sheet>.spacer{flex:1 1 auto}
.sheet>.rembox{flex:1 1 auto;min-height:36px;display:flex;border:1px solid #B9C7DA}
.rembox .rl{width:10.5%;flex:none;background:#EEF4FA;color:#5A6B85;font-size:6.6px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:6px;border-right:1px solid #B9C7DA}
.rembox .rv{flex:1;padding:5px 7px;font-size:8.5px;white-space:pre-wrap;overflow-wrap:anywhere;color:#111827}
.pgno{align-self:flex-end;font-size:7.5px;font-weight:700;color:#5A6B85;letter-spacing:.06em;text-transform:uppercase;margin:-3px 0 -2px}
.mat tr.more td{text-align:center;font-style:italic;color:#5A6B85;background:#EEF4FA!important;font-size:8px}

.drawer{position:fixed;inset:0;z-index:20;display:flex;justify-content:flex-end;background:rgba(8,14,28,.45)}
.drawer-in{width:min(460px,100%);height:100%;background:var(--panel);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.dr-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dr-head h3{margin:0;font-family:var(--display);font-size:18px;margin-right:auto}
.dr-search{padding:12px 16px}
.dr-search input{width:100%;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:9px 11px}
.dr-list{flex:1;overflow-y:auto;padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.row .no{font-family:var(--mono);font-weight:600}
.row .meta{color:var(--muted);font-size:12px;grid-column:1/-1;overflow-wrap:anywhere}
.row .btns{display:flex;gap:6px;grid-column:1/-1;flex-wrap:wrap;margin-top:4px}
.row .btns .btn{padding:5px 10px;font-size:12px}
.row.current{border-color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;line-height:1.5}
.dr-foot{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.dr-foot .set{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:1100px){
  .main{grid-template-columns:minmax(0,1fr)}
  .tabs{display:flex}
  .preview{position:static}
  body[data-view="form"] .preview{display:none}
  body[data-view="preview"] .form{display:none}
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .f.w2{grid-column:1/-1}
  .conds{grid-template-columns:minmax(0,1fr)}
  .brand span{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- The printed LR (always paper white, fixed brand colours) ---------- */
.sheet{width:794px;height:1123px;background:#FFFFFF;color:#1F2937;font-family:"IBM Plex Sans",Arial,sans-serif;font-size:10.5px;padding:22px 30px 18px;display:flex;flex-direction:column;gap:5px;overflow:hidden}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th{border:1px solid #B9C7DA;padding:2px 6px;height:19px;vertical-align:middle;overflow-wrap:anywhere;line-height:1.25}
.sheet td.l{background:#EEF4FA;color:#5A6B85;font-size:7.8px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sheet td.v{color:#111827;font-weight:500}
.sheet td.b{font-weight:700}
.sh-head{display:flex;align-items:stretch;gap:10px}
.sh-logo{width:90px;height:78px;object-fit:contain}
.sh-co{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.sh-name{font-family:"Archivo","Arial Narrow",Arial,sans-serif;font-weight:800;font-size:27px;color:#12357A;letter-spacing:.01em;line-height:1}
.sh-sub{color:#5A6B85;font-size:9.4px}
.sh-contact{font-size:9.4px;font-weight:600;color:#1F2937}
.sh-box{width:224px}
.sh-qr{width:80px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.sh-qr img{width:74px;height:74px;image-rendering:pixelated;display:block}
.sh-qr span{font-size:7px;font-weight:700;color:#12357A;letter-spacing:.06em;text-transform:uppercase}
.qr-ph{width:74px;height:74px;border:1px dashed #B9C7DA;border-radius:4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:7px;color:#5A6B85;line-height:1.3;padding:4px}
.sh-boxt{background:#12357A;color:#fff;font-family:"Archivo",Arial,sans-serif;font-weight:800;font-size:15px;text-align:center;letter-spacing:.08em;padding:6px 0}
.sh-box td{height:20px}
.sh-box td.no{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;color:#12357A;text-align:center}
.sh-box td.c{text-align:center;font-weight:700}
.sh-bar{height:4px;background:#3FA0DD;margin:1px 0 0}
.sec{background:#12357A;color:#fff;font-weight:700;font-size:8.8px;letter-spacing:.11em;text-transform:uppercase;padding:3.5px 8px}
.sec.sky{background:#3FA0DD}
.sec .h{text-transform:none;letter-spacing:0;font-weight:500;opacity:.9;margin-left:6px}
.duo{display:flex;gap:0}
.duo>.sec{flex:1}
.mat th{background:#DCE9F6;color:#12357A;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center;height:24px}
.mat td{height:18px}
.mat tr:nth-child(even) td{background:#F7FAFD}
.mat td.n{text-align:right;font-family:"IBM Plex Mono",monospace;font-size:9.9px}
.mat td.c{text-align:center}
.mat tr.tot td{background:#12357A;color:#fff;font-weight:700;border-color:#12357A}
.lower{display:flex;gap:8px}
.lower .conds-t{flex:1.1}
.lower .stamp{flex:1;border:1px solid #B9C7DA;display:flex;flex-direction:column}
.stamp .st-h,.conds-t th{background:#DCE9F6;color:#12357A;font-size:8.3px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:4px 6px;height:auto}
.stamp .st-h{text-align:center}
.conds-t td{font-size:9.4px;height:19px}
.conds-t td.t{width:26px;text-align:center;font-weight:700;font-size:12.1px}
.t.yes{color:#15803D} .t.no{color:#B42318}
.spacer{flex:1}
.foot{display:flex;gap:8px}
.decl{flex:1.1;background:#EEF4FA;border:1px solid #B9C7DA;padding:8px 10px;font-style:italic;color:#5A6B85;font-size:8.8px;line-height:1.45;display:flex;flex-direction:column;justify-content:space-between}
.decl .tt{font-style:normal;font-weight:700;font-size:8.3px;letter-spacing:.08em;text-transform:uppercase;color:#12357A}
.decl ol{margin:3px 0 0;padding-left:13px;font-style:normal;font-size:7.4px;line-height:1.4;color:#374151}
.decl li{margin:0 0 1px}
.stamp .st-note{margin-top:auto;padding:4px 6px;font-size:8.5px;font-style:italic;color:#5A6B85;border-top:1px dashed #B9C7DA}
.decl .place{font-style:normal;font-weight:700;font-size:8px;letter-spacing:.06em;text-transform:uppercase}
.sign{flex:1;border:1px solid #B9C7DA;display:flex;flex-direction:column;align-items:center}
.sign img{height:64px;margin:6px 0 2px;object-fit:contain}
.sign .cap{margin-top:auto;width:100%;background:#EEF4FA;border-top:1px solid #B9C7DA;text-align:center;color:#12357A;font-weight:700;font-size:8.8px;padding:4px}
.thanks{background:#12357A;color:#fff;text-align:center;font-size:8.8px;padding:5px;letter-spacing:.03em}
.draftmark{color:#B45309}

.lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lock form{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 24px;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.lock img{width:92px;margin:0 auto}
.lock h1{font-family:var(--display);font-size:22px;margin:0;color:var(--accent)}
.lock input{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:12px;text-align:center;font-size:26px;letter-spacing:.4em;font-family:var(--mono);width:100%}
.lock #emailIn{letter-spacing:0;font-size:16px;font-family:var(--body)}
.lock .step{display:flex;flex-direction:column;gap:10px}
.lock .msg{font-size:13px;line-height:1.45;overflow-wrap:anywhere;border-radius:8px;padding:9px 11px;text-align:left;background:var(--chip);color:var(--ink)}
.lock .msg.err{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger)}
.lock .msg.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.lock .lbl-top{font-size:12px;font-weight:600;color:var(--muted);text-align:left}
.lock .sent{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.lock .sent b{color:var(--ink)}
.lock .row2{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn.big{padding:12px 14px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn .spin{display:none;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
.btn.loading .spin{display:inline-block}
.btn.loading{opacity:.85}
@keyframes sp{to{transform:rotate(360deg)}}
.linkbtn{background:none;border:none;color:var(--accent);font-weight:600;cursor:pointer;padding:2px;text-decoration:underline}
.linkbtn:disabled{color:var(--muted);text-decoration:none;cursor:default}
.modal{position:fixed;inset:0;z-index:25;background:rgba(8,14,28,.5);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal-in{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:min(440px,100%);display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow-y:auto}
.modal-in h3{margin:0;font-family:var(--display);font-size:18px;color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;cursor:pointer}
.chk input{margin-top:3px;width:18px;height:18px;flex:none}
.chk small{color:var(--muted);overflow-wrap:anywhere}
.chk:has(input:disabled){opacity:.6;cursor:default}
.modal-btns{display:flex;justify-content:flex-end;gap:8px}
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  body::before{display:none}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  #printArea .sheet{-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:page;page-break-after:always}
  #printArea .sheet:last-child{break-after:auto;page-break-after:auto}
}

  all.forEach(d=>{if(d.lrNo&&d.lrNo.startsWith(p)){const k=parseInt(d.lrNo.slice(p.length));if(!isNaN(k)&&k>max)max=k}});
  return p+String(max+1).padStart(5,"0");
}

const QR_CACHE=new Map();
function verifyUrl(L){try{return new URL("verify.html?lr="+encodeURIComponent(L.lrNo)+"&k="+encodeURIComponent(L.vk),location.href).href}catch(e){return ""}}
function qrHTML(L){
  if(!L.lrNo||!L.vk)return `<div class="qr-ph">QR code appears after saving</div>`;
  const url=verifyUrl(L);
  if(typeof qrcode!=="function")return `<div class="qr-ph">Verify code<br><b>${esc(L.vk)}</b></div>`;
  let src=QR_CACHE.get(url);
  if(!src){try{const q=qrcode(0,"M");q.addData(url);q.make();src=q.createDataURL(4,0);QR_CACHE.set(url,src)}catch(e){return `<div class="qr-ph">Verify code<br><b>${esc(L.vk)}</b></div>`}}

/* ---------- Google Sheet connection & sign-in ---------- */
const API=(window.LR_CONFIG&&window.LR_CONFIG.scriptUrl)||"";
let token="",me=null,unlocked=false;
const isAdmin=()=>!!(me&&me.role==="Admin");
async function api(action,data,timeoutMs){
  if(!API||API.indexOf("script.google.com")<0)throw new Error("The Google Sheet link is not set yet. Add it to config.js.");
  const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),timeoutMs||45000);
  let r;
  try{r=await fetch(API,{method:"POST",body:JSON.stringify(Object.assign({action,token},data||{})),signal:ctl.signal})}
  catch(e){throw new Error(e.name==="AbortError"?"The Google Sheet is taking too long to answer. Please try again.":"Could not reach the Google Sheet. Check your internet connection and try again.")}
  finally{clearTimeout(timer)}
  let j;try{j=await r.json()}catch(e){throw new Error("The Google Sheet did not answer properly. Ask the admin to check the script deployment.")}
  if(!j.ok){if(j.code==="auth"&&action!=="requestCode"&&action!=="verifyCode"){signOut(j.error)}const err=new Error(j.error||"Request failed");err.code=j.code;throw err}
  return j;
}

  if(s>0){b.disabled=true;b.textContent=`Resend code in ${s}s`}else{b.disabled=false;b.textContent="Resend code";clearInterval(resendTimer)}}
function validEmail(em){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)}
function goToCode(em){
  $("sentTo").textContent=em;$("codeIn").value="";showStep("code");
  try{localStorage.setItem("lrEmail",em)}catch(e){}

async function sendCode(){
  if(sending)return;
  const em=($("sentTo").textContent&&!$("stepCode").hidden?$("sentTo").textContent:$("emailIn").value).trim().toLowerCase();
  if(!validEmail(em)){showStep("email");lockMsg("Enter a valid email address, like name@gmail.com.","err");return}
  goToCode(em);                          // show the code box straight away
  sending=true;resendTick();setBusy($("bSend"),true,"Sending…");
  lockMsg("Sending your code… this can take up to 15 seconds.","info");
  try{
    await api("requestCode",{email:em},40000);
    lockMsg("If this email is on the LR Desk access list, a code is on its way. It can take a minute, so check Spam too. No email after 2 minutes? Ask the admin to add this email.","ok");
    resendAt=Date.now()+30000;
  }catch(e){
    lockMsg(e.code==="limit"?e.message+" If you already received a code in the last 10 minutes, you can still enter it.":e.message+" Tap Resend code to try again.","err");
    resendAt=0;
  }finally{
    sending=false;setBusy($("bSend"),false,"Email me a sign-in code");
    clearInterval(resendTimer);resendTimer=setInterval(resendTick,500);resendTick();
  }
}
async function verifyCode(){
  const code=$("codeIn").value.replace(/\D/g,"");
  if(code.length!==6){lockMsg("Enter the 6-digit code from the email.","err");return}
  if($("bVerify").disabled)return;
  setBusy($("bVerify"),true,"Signing in…");lockMsg("Checking your code…","info");
  try{
    const j=await api("verifyCode",{email:$("sentTo").textContent,code});
    token=j.token;try{localStorage.setItem("lrToken",token)}catch(e){}
    lockMsg("");await startSession(j);
  }catch(e){lockMsg(e.message,"err");$("codeIn").select()}
  finally{setBusy($("bVerify"),false,"Sign in")}
}
async function startSession(j){
  if(!j){j=await api("me")}
  me=j.user;settings=j.settings||settings;SIGN=j.sign||"";unlocked=true;
  $("lock").hidden=true;$("who").textContent=`${me.name||me.email} · ${me.role}`;$("who").title=me.email;
  document.body.dataset.role=me.role;status();
  await refresh(true);
}
function signOut(msg){
  token="";me=null;unlocked=false;SIGN="";all=[];listLoaded=false;
  try{localStorage.removeItem("lrToken")}catch(e){}
  $("who").textContent="";renderList();status();schedule();
  $("sentTo").textContent="";$("codeIn").value="";
  $("drawer").hidden=true;showLock(msg||"Signed out. Sign in again to continue.");
}
$("lockForm").addEventListener("submit",e=>{e.preventDefault();if(!$("stepEmail").hidden)sendCode();else verifyCode()});
$("bResend").onclick=sendCode;
$("bChange").onclick=()=>{$("sentTo").textContent="";lockMsg("");showStep("email")};
$("bHave").onclick=()=>{const em=$("emailIn").value.trim().toLowerCase();if(!validEmail(em)){lockMsg("Enter your email first, then tap this again.","err");$("emailIn").focus();return}goToCode(em);lockMsg("Enter the code from your latest email. Codes work for 10 minutes.","info")};
$("codeIn").addEventListener("input",e=>{const v=e.target.value.replace(/\D/g,"").slice(0,6);if(e.target.value!==v)e.target.value=v;if(v.length===6)verifyCode()});
try{const em=localStorage.getItem("lrEmail");if(em)$("emailIn").value=em}catch(e){}
async function refresh(first){
  try{
    const j=await api("list");
    all=(j.lrs||[]).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    if(j.settings)settings=j.settings;
    listLoaded=true;
    fillLists();renderList();
    if(first&&!dirty&&all.length)load(all[0]);
    status();schedule();
  }catch(e){if(e.code!=="auth")toast(e.message)}
}

/* ---------- Saving, printing, PDF ---------- */
async function save(){
  if(!unlocked){showLock("Sign in to save LRs.");return false}
  busy(true);
  try{
    const body=JSON.parse(JSON.stringify(cur));const b=bill(cur);body.billName=b.name||"";body.billAddr=b.addr||"";body.billGst=b.gst||"";
    const isNew=!cur.lrNo;
    const j=await api("save",{lr:body});
    cur=j.lr;if(!cur.items||!cur.items.length)cur.items=[blankItem()];cur.cond=cur.cond||{};
    const i=all.findIndex(d=>d.lrNo===cur.lrNo);if(i>=0)all[i]=JSON.parse(JSON.stringify(cur));else all.unshift(JSON.parse(JSON.stringify(cur)));
    dirty=false;try{localStorage.removeItem("lrDraft")}catch(e){}
    fillLists();renderList();status();schedule();renderStatus();toast(isNew?`Saved as ${cur.lrNo}`:`${cur.lrNo} updated`);if(isNew)setTimeout(autoEmail,400);return true;
  }catch(e){if(e.code!=="auth")toast(e.message);return false}
  finally{busy(false)}
}
async function ensureSaved(){if(dirty||!cur.lrNo)return await save();return true}
function imagesReady(el){return Promise.all([...el.querySelectorAll("img")].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r})))}
async function doPrint(){
  if(!(await ensureSaved()))return;
  const pa=$("printArea");pa.innerHTML=sheetHTML(cur);await imagesReady(pa);
  try{await document.fonts.ready}catch(e){}
  setTimeout(()=>window.print(),60);
}
async function makePdf(scale){
  try{await document.fonts.ready}catch(e){}
  const host=document.createElement("div");host.style.cssText="position:fixed;left:-12000px;top:0;";host.innerHTML=sheetHTML(cur);document.body.appendChild(host);
  try{
    await imagesReady(host);
    const doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
    const sheets=[...host.querySelectorAll(".sheet")];
    for(let k=0;k<sheets.length;k++){
      const canvas=await html2canvas(sheets[k],{scale:scale||2.4,backgroundColor:"#ffffff",logging:false});
      if(k)doc.addPage();
      doc.addImage(canvas.toDataURL("image/jpeg",0.9),"JPEG",0,0,210,297);
    }
    return doc;
  }finally{host.remove()}
}
async function pdf(){
  if(!(await ensureSaved()))return;
  busy(true,"Preparing PDF…");
  try{const doc=await makePdf(2.4);doc.save(`LR_${cur.lrNo}.pdf`);toast("PDF downloaded")}
  catch(e){toast("Could not create the PDF. Try again.")}
  finally{busy(false)}
}

/* ---------- Email PDF ---------- */
const splitEmails=s=>String(s||"").split(/[,;\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean);
const okEmail=x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x);
function recipients(){
  const out=[];
  if($("emCnor").checked)out.push(...splitEmails(cur.cnorEmail));
  if($("emCnee").checked)out.push(...splitEmails(cur.cneeEmail));
  out.push(...splitEmails($("emExtra").value));
  return [...new Set(out)];
}
function openEmail(){
  if(!unlocked){showLock("Sign in to email LRs.");return}
  const ce=splitEmails(cur.cnorEmail),ne=splitEmails(cur.cneeEmail);
  $("emCnorLbl").textContent=ce.length?ce.join(", "):"No email entered";
  $("emCneeLbl").textContent=ne.length?ne.join(", "):"No email entered";
  $("emCnor").checked=ce.length>0;$("emCnor").disabled=!ce.length;
  $("emCnee").checked=ne.length>0;$("emCnee").disabled=!ne.length;
  $("emCcRow").hidden=!settings.cc;$("emCcLbl").textContent=settings.cc||"";$("emCc").checked=!!settings.cc;
  $("emExtra").value="";$("emNote").textContent="";$("emNote").className="status";
  const last=(cur.emailLog||[]).slice(-1)[0];
  $("emLast").textContent=last?`Last emailed ${last.at} to ${last.to}`:"";
  $("emailBox").hidden=false;
}
async function sendEmail(list,cc,auto){
  if(!list.length&&!cc)throw new Error("Add at least one email address.");
  const bad=list.filter(x=>!okEmail(x));if(bad.length)throw new Error("Check this email: "+bad[0]);
  const doc=await makePdf(2);
  const b64=doc.output("datauristring").split(",")[1];
  const j=await api("emailLR",{lrNo:cur.lrNo,to:list,cc:cc?settings.cc:"",pdf:b64,auto:!!auto},90000);
  if(j.lr){cur.emailLog=j.lr.emailLog;const i=all.findIndex(d=>d.lrNo===cur.lrNo);if(i>=0)all[i].emailLog=j.lr.emailLog}
  return j;
}
$("bEmail").onclick=async()=>{if(!(await ensureSaved()))return;openEmail()};
$("emCancel").onclick=()=>{$("emailBox").hidden=true};
$("emailBox").addEventListener("click",e=>{if(e.target===$("emailBox"))$("emailBox").hidden=true});
$("emSend").onclick=async()=>{
  const list=recipients(),cc=$("emCc").checked&&!!settings.cc;
  const n=$("emNote");$("emSend").disabled=true;n.className="status";n.textContent="Preparing PDF and sending…";
  try{const j=await sendEmail(list,cc,false);$("emailBox").hidden=true;toast(`${cur.lrNo} emailed to ${j.sentTo}`)}
  catch(e){n.className="status dirty";n.textContent=e.message}
  finally{$("emSend").disabled=false}
};
async function autoEmail(){
  if(!settings.autoEmail)return;
  const list=[...new Set([...splitEmails(cur.cnorEmail),...splitEmails(cur.cneeEmail)])].filter(okEmail);
  if(!list.length){toast(`${cur.lrNo} saved. No party email, so it was not emailed.`);return}
  toast(`Emailing ${cur.lrNo} to ${list.length} ${list.length>1?"people":"person"}…`);
  try{const j=await sendEmail(list,!!settings.cc,true);toast(`${cur.lrNo} saved and emailed to ${j.sentTo}`)}
  catch(e){if(e.code!=="auth")toast(`Saved, but email failed: ${e.message} Use Email PDF to retry.`)}
}
function load(L){cur=JSON.parse(JSON.stringify(L));if(!cur.items||!cur.items.length)cur.items=[blankItem()];cur.cond=cur.cond||{};dirty=false;buildForm();schedule();status();window.scrollTo(0,0)}
function newLR(from){
  const L=blankLR();
  if(from){const keep=["freight","veh","tveh","driver","driverMob","plant","vendor","ccode","lp","dest","cnorName","cnorAddr","cnorGst","cneeName","cneeAddr","cneeGst","cnorEmail","cneeEmail","billTo","billName","billAddr","billGst","billState","billContact","billPan","inco"];keep.forEach(k=>{if(from[k]!=null)L[k]=from[k]});
    L.items=(from.items||[]).map(i=>({...blankItem(),desc:i.desc,code:i.code}))}
  load(L);if(from){dirty=true;status()}
}

/* ---------- Delivery status ---------- */
function billEmails(L){return splitEmails(bill(L).email).filter(okEmail)}
function statusHTML(){
  if(!cur.lrNo)return `<div class="stat-row"><span class="chip draft">Not saved</span><span class="status">Save the LR first. Its status starts as In Transit.</span></div>`;
  if(cur.delivered)return `<div class="stat-row"><span class="chip done">Delivered${cur.deliveredOn?" · "+fd(cur.deliveredOn):""}</span>
    <span class="status" id="statNote">${cur.deliveryEmailedAt?`Delivery email sent ${esc(cur.deliveryEmailedAt)}${cur.deliveryEmailedTo?" to "+esc(cur.deliveryEmailedTo):""}.`:"No delivery email was sent."}</span>
    <button type="button" class="btn ghost" id="bUndeliver">Undo, back to In Transit</button></div>`;
  return `<div class="stat-row"><span class="chip transit">In Transit</span>
    <div class="f"><label for="i_delDate">Delivered on</label><input id="i_delDate" type="date" value="${today()}"></div>
    <button type="button" class="btn primary" id="bDeliver">Mark as delivered</button>
    <span class="status" id="statNote">${statusNote()}</span></div>`;
}
function statusNote(){
  if(!settings.deliveryEmail)return "Delivery emails are switched off in Settings.";
  const em=billEmails(cur);
  return em.length?`Billed To party (${esc(em.join(", "))}) will get a "delivered" email.`:"No email for the Billed To party, so no delivery email will be sent.";
}
function renderStatus(){const w=$("statWrap");if(w)w.innerHTML=statusHTML()}
function refreshStatusNote(){const n=$("statNote");if(n&&!cur.delivered)n.innerHTML=statusNote()}
async function markDelivered(lrNo,on,date){
  if(!unlocked){showLock("Sign in to update delivery status.");return}
  if(lrNo===cur.lrNo&&dirty){if(!(await save()))return}
  const btn=$(on?"bDeliver":"bUndeliver");if(btn)btn.disabled=true;
  try{
    const j=await api("setDelivered",{lrNo,delivered:on,date:date||today(),link:verifyUrl({lrNo,vk:(all.find(d=>d.lrNo===lrNo)||cur).vk})},60000);
    const i=all.findIndex(d=>d.lrNo===lrNo);if(i>=0)all[i]=j.lr;
    if(cur.lrNo===lrNo){["delivered","deliveredOn","deliveredBy","deliveryEmailedAt","deliveryEmailedTo"].forEach(k=>cur[k]=j.lr[k]);renderStatus()}
    renderList();
    toast(on?(j.emailedTo?`${lrNo} marked delivered. Email sent to ${j.emailedTo}`:`${lrNo} marked delivered${j.emailNote?". "+j.emailNote:""}`):`${lrNo} is back to In Transit`);
  }catch(e){if(e.code!=="auth")toast(e.message);if(btn)btn.disabled=false}
}

/* ---------- Saved list ---------- */
let confirmDel=null;
function renderList(){
  const q=$("q").value.trim().toLowerCase();
  const rows=all.filter(d=>!q||[d.lrNo,d.veh,d.cnorName,d.cneeName,d.billName,d.inv,d.dno,d.delivered?"delivered":"in transit"].join(" ").toLowerCase().includes(q));
  $("cnt").textContent=all.length?`(${all.length})`:"";
  if(!all.length){$("list").innerHTML=`<div class="empty">No saved LRs yet.<br>Fill in the form and press <b>Save</b>. The first one gets ${esc(nextNo())}.</div>`;return}
  if(!rows.length){$("list").innerHTML=`<div class="empty">No LR matches “${esc(q)}”.</div>`;return}
  $("list").innerHTML=rows.map(d=>{const T=totals(d);return `<div class="row${d.lrNo===cur.lrNo?" current":""}"><span class="no">${esc(d.lrNo)} ${d.delivered?`<span class="chip done sm">Delivered</span>`:`<span class="chip transit sm">In Transit</span>`}</span><span class="status">${fd(d.date)}</span>
   <span class="meta">${esc(d.veh||"No vehicle")} · ${esc(d.cnorName||"?")} → ${esc(d.cneeName||"?")}${T.n?` · ${T.n.toFixed(3)} MT`:""}${d.inv?` · Inv ${esc(d.inv)}`:""}${d.createdBy?` · by ${esc(d.createdByName||d.createdBy)}`:""}</span>
   <div class="btns">${confirmDel===d.lrNo?`<span class="status dirty" style="align-self:center">Delete ${esc(d.lrNo)} for good?</span><button class="btn danger" data-delok="${esc(d.lrNo)}" type="button">Yes, delete</button><button class="btn" data-delno="1" type="button">Keep</button>`
   :`<button class="btn" data-open="${esc(d.lrNo)}" type="button">Open</button><button class="btn" data-dup="${esc(d.lrNo)}" type="button">New trip from this</button>${d.delivered?"":`<button class="btn" data-deliver="${esc(d.lrNo)}" type="button">Mark delivered</button>`}${isAdmin()?`<button class="btn danger ghost" data-ask="${esc(d.lrNo)}" type="button">Delete</button>`:""}`}</div></div>`}).join("");
}
$("list").addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;const find=n=>all.find(d=>d.lrNo===n);
  if(b.dataset.open){if(dirty&&!confirmLeave())return;load(find(b.dataset.open));closeDrawer()}
  else if(b.dataset.dup){if(dirty&&!confirmLeave())return;newLR(find(b.dataset.dup));closeDrawer();toast("New LR started with the same parties and vehicle")}
  else if(b.dataset.deliver){b.disabled=true;markDelivered(b.dataset.deliver,true,today())}
  else if(b.dataset.ask){confirmDel=b.dataset.ask;renderList()}
  else if(b.dataset.delno){confirmDel=null;renderList()}
  else if(b.dataset.delok){const n=b.dataset.delok;confirmDel=null;
    try{await api("delete",{lrNo:n});all=all.filter(d=>d.lrNo!==n);renderList();toast(`${n} deleted`);if(cur.lrNo===n)newLR()}catch(err){if(err.code!=="auth")toast(err.message)}}
});
let leaveArmed=0;function confirmLeave(){if(Date.now()-leaveArmed<4000)return true;leaveArmed=Date.now();toast("You have unsaved changes. Click again to discard them.");return false}
$("q").addEventListener("input",renderList);
function openDrawer(){if(!unlocked){showLock("Sign in to see saved LRs.");return}$("drawer").hidden=false;$("setBox").hidden=!isAdmin();$("sPrefix").value=settings.prefix;$("sStart").value=settings.start;renderList();$("q").focus()}
function closeDrawer(){$("drawer").hidden=true;confirmDel=null}
$("bList").onclick=openDrawer;$("bClose").onclick=closeDrawer;$("bRefresh").onclick=()=>refresh(false).then(()=>toast("List updated"));
$("drawer").addEventListener("click",e=>{if(e.target===$("drawer"))closeDrawer()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("drawer").hidden)closeDrawer()});
$("bSet").onclick=async()=>{
  const p=$("sPrefix").value.trim().toUpperCase().replace(/[^A-Z0-9-]/g,"");const s=parseInt($("sStart").value);
  if(!p||!(s>0)){$("setNote").textContent="Enter a prefix (letters or digits) and a starting number above 0.";return}
  try{const j=await api("settings",{prefix:p,start:s});settings=j.settings;$("sPrefix").value=settings.prefix;$("setNote").textContent=`Next new LR: ${nextNo()}`;schedule();renderList()}catch(e){$("setNote").textContent=e.message}
};
$("bCsv").onclick=()=>{
  const H=["LR No","LR Date","Freight","Vehicle","Consignor","Consignee","Billed To","Billed Party","Billed GSTIN","Invoice No","Invoice Date","Invoice Value","Delivery No","Gross Wt (MT)","Net Wt (MT)","Rcvd Gross Wt (MT)","GRN No"];
  const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const lines=[H.join(",")].concat([...all].sort((a,b)=>a.lrNo<b.lrNo?-1:1).map(d=>{const T=totals(d),b=bill(d);return[d.lrNo,fd(d.date),d.freight,d.veh,d.cnorName,d.cneeName,d.billTo,b.name,b.gst,d.inv,fd(d.invDate),d.invVal,d.dno,T.g.toFixed(3),T.n.toFixed(3),T.r.toFixed(3),d.grn].map(q).join(",")}));
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv"}));a.download=`LR_Register_${today()}.csv`;document.body.appendChild(a);a.click();a.remove();
};

/* ---------- Toolbar, tabs, lock ---------- */
$("bNew").onclick=()=>{if(dirty&&!confirmLeave())return;newLR()};
$("bSave").onclick=save;$("bPdf").onclick=pdf;$("bPrint").onclick=doPrint;
$("bLock").onclick=()=>signOut();
function view(v){document.body.dataset.view=v;$("tForm").setAttribute("aria-selected",v==="form");$("tPrev").setAttribute("aria-selected",v==="preview");if(v==="preview")requestAnimationFrame(fit)}
$("tForm").onclick=()=>view("form");$("tPrev").onclick=()=>view("preview");view("form");

/* ---------- Start ---------- */
(function start(){
  let draft=null;try{draft=JSON.parse(localStorage.getItem("lrDraft")||"null")}catch(e){}
  if(draft&&typeof draft==="object"){cur=Object.assign(blankLR(),draft);dirty=true}
  buildForm();schedule();status();
  try{document.fonts.ready.then(()=>schedule())}catch(e){}
  if(!API||API.indexOf("script.google.com")<0){showLock("Setup needed: paste your Google Sheet web app link into config.js on GitHub.");return}
  try{token=localStorage.getItem("lrToken")||""}catch(e){}
  if(token){startSession().catch(e=>{if(e.code!=="auth")showLock(e.message)})}else showLock("");
})();

</script>
