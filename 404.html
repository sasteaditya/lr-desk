<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>LR Desk</title>
<script>
// WhatsApp booking alerts can open /bk=ATBK00001 (or /bk/ATBK00001): send them to the booking in LR Desk
(function () {
  var p = location.pathname.replace(/^\/+/, ''), m;
  try { p = decodeURIComponent(p); } catch (e) {}
  m = /^\??bk[=\/]([A-Za-z0-9-]{3,24})\/?$/i.exec(p);
  if (m) location.replace('/?bk=' + encodeURIComponent(m[1].toUpperCase()));
})();
</script>
<style>
:root{--bg:#EEF2F8;--ink:#14213D;--link:#12357A}
@media (prefers-color-scheme:dark){:root{--bg:#0D1525;--ink:#E8EEF7;--link:#8DBEF3}}
body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
main{text-align:center;padding:24px}
h1{font-size:22px;margin:0 0 8px}
a{color:var(--link);font-weight:600}
</style>
</head>

</body>
